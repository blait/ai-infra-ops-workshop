[project]
name = "aiops-slack-agent"
version = "0.1.0"
description = "Workshop module 3 demo: internal AI-Ops Slack agent on the Claude Agent SDK + Amazon Bedrock"
readme = "README.md"
requires-python = ">=3.11"
# Versions below were installed and verified on 2026-10-15 (see README "검증한 버전").
dependencies = [
    "claude-agent-sdk==0.2.167",
    "slack-bolt==1.30.0",
    "slack-sdk==3.45.0",
    "aiohttp>=3.9",
    "boto3>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]
agentcore = ["starlette>=0.37", "uvicorn>=0.30"]
ui = ["streamlit==1.66.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aiops", "aiops.tools", "aiops.cloud"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
