[server]
address = "127.0.0.1"
port = 8501
headless = true
fileWatcherType = "poll"
runOnSave = true
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#147D72"
backgroundColor = "#F6F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#182C3A"
font = "sans serif"
